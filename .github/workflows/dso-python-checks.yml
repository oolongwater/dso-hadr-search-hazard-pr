name: DSO Python Checks

permissions:
  contents: read

on:
  push:
    paths:
      - "dso/**"
      - "pixi.toml"
      - ".github/workflows/dso-python-checks.yml"
  pull_request:
    paths:
      - "dso/**"
      - "pixi.toml"
      - ".github/workflows/dso-python-checks.yml"

jobs:
  dso-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.1
      - name: Check formatting and lint
        run: pixi run format
      - name: Check types
        run: pixi run typecheck
      - name: Run local unit tests only
        # Generated-asset and simulator integration checks are intentionally local-only.
        run: pixi run test
