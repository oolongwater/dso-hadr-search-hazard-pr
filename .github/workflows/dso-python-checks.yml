name: DSO Python Checks

on:
  push:
    paths:
      - "dso/**"
      - "pixi.toml"
      - ".github/workflows/dso-python-checks.yml"
  pull_request:
    paths:
      - "dso/**"
      - "pixi.toml"
      - ".github/workflows/dso-python-checks.yml"

jobs:
  dso-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.1
      - run: pixi run format
      - run: pixi run typecheck
      - run: pixi run test
